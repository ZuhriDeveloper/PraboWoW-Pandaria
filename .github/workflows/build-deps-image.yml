name: build-deps-image

# Base image berisi Boost 1.91 + OpenSSL 4.0 yang harus di-compile dari
# source (tidak ada di apt Ubuntu 24.04). Build ~1 jam, tapi JARANG berubah:
# hanya saat core menaikkan versi dependency.
#
# Dijalankan manual. Jangan dipasang pada `push`, karena akan membuang satu
# jam runner setiap kali ada perubahan kecil di repo ini.

on:
  workflow_dispatch:
    inputs:
      boost_version:
        description: "Versi Boost"
        default: "1.91.0"
      openssl_version:
        description: "Versi OpenSSL"
        default: "4.0.0"

concurrency:
  group: deps-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Hitung namespace dan nama arsip Boost
        id: ns
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # Arsip Boost dinamai dengan underscore: 1.91.0 -> boost_1_91_0
          echo "boost_underscore=$(echo '${{ inputs.boost_version }}' | tr '.' '_')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/deps.Dockerfile
          push: true
          build-args: |
            BOOST_VERSION=${{ inputs.boost_version }}
            BOOST_UNDERSCORE=${{ steps.ns.outputs.boost_underscore }}
            OPENSSL_VERSION=${{ inputs.openssl_version }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/skyfire-deps:boost${{ inputs.boost_version }}-ossl${{ inputs.openssl_version }}
            ghcr.io/${{ steps.ns.outputs.owner }}/skyfire-deps:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
