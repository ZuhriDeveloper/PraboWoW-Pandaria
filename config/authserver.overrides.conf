# =============================================================================
# Override authserver.conf. Di-BAKE ke dalam image; render-config.sh
# menggabungkannya di atas authserver.conf.dist bawaan core saat container
# start, dan mengisi ${VAR} dari environment.
#
# Hanya key yang berbeda dari dist yang ditulis di sini, supaya opsi baru dari
# upstream otomatis terpakai dengan default-nya saat core di-update.
# =============================================================================

# --- Database ---------------------------------------------------------------
LoginDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};${DB_AUTH}"

# Setup database diserahkan ke core, bukan ke script import manual.
# DatabaseSetup.cpp:554-640 --
#   DB kosong + AutoSetup=1 -> install sql/base/auth_database.sql lalu
#                              terapkan sql/updates/auth/* di atasnya
#   DB terisi               -> lewati base, hanya cek update baru
# Aman dibiarkan 1 selamanya; ini sekaligus mekanisme upgrade DB.
LoginDatabase.AutoSetup = 1

# Database dibuat oleh deploy/mysql-init, jadi core tidak butuh CREATE DATABASE.
LoginDatabase.AutoCreate = 0

# SENGAJA 0. AutoBaseline menandai semua file update sebagai sudah diterapkan
# TANPA menjalankannya -- benar hanya untuk mengadopsi DB lama, tapi pada
# deployment bersih ia diam-diam melewatkan update yang dibutuhkan. Dengan 0,
# core berhenti dengan pesan jelas (DatabaseSetup.cpp:593-599).
LoginDatabase.AutoBaseline = 0

LoginDatabase.SqlPath = "${SQL_DIR_CONTAINER}"
LoginDatabase.AllowUpdateHashMismatch = 0
LoginDatabase.ImportPendingUpdates = 0

# --- Jaringan ---------------------------------------------------------------
RealmServerPort = ${AUTH_PORT}
BindIP = "0.0.0.0"

# --- Log --------------------------------------------------------------------
LogsDir = "${LOGS_DIR_CONTAINER}"

# --- Keamanan ---------------------------------------------------------------
# 2FA opt-in per akun (AuthSocket.cpp:507-518): akun tanpa data 2FA tidak
# terpengaruh, jadi aman dinyalakan sejak awal.
Auth2FA.Enabled = 1
Auth2FA.TokenWindow = 1

# Dist default 0 = tanpa batas percobaan password. Port 3724 terbuka ke
# internet, jadi batasi.
WrongPass.MaxCount = 5
WrongPass.BanTime = 600
WrongPass.BanType = 0
