# =============================================================================
# Override playerbots.conf (modul mod-playerbots di repo core). Di-BAKE ke
# image; render-config.sh menggabungkannya di atas playerbots.conf.dist saat
# container start dan mengisi ${VAR} dari environment.
#
# Modul membaca playerbots.conf dari direktori yang sama dengan worldserver.conf
# (PlayerbotMgr.cpp: ResolveModuleConfigPath), jadi file hasil render WAJIB ada
# di /opt/skyfire/etc -- kalau tidak, modul mati diam-diam dengan satu baris
# error di log. Referensi semua key: modules/mod-playerbots/conf/playerbots.conf.dist.
# =============================================================================

# --- Saklar utama ------------------------------------------------------------
# Satu env var mengatur ketiganya: modul hidup, pool bot acak diisi, dan akun
# bot dibuat saat boot. Tidak ada gunanya menyalakan salah satu tanpa yang lain.
Playerbots.Enable               = ${PLAYERBOTS_ENABLE}
Playerbots.RandomBots.Enable    = ${PLAYERBOTS_ENABLE}
Playerbots.AutoCreate.OnStartup = ${PLAYERBOTS_ENABLE}

# --- Populasi ----------------------------------------------------------------
# Tiap bot adalah satu Player penuh yang di-tick di world thread; mulai kecil
# dan naikkan setelah melihat CPU/RAM container world. Login dipacu
# LoginsPerTick=1 (default dist) supaya pengisian pool tidak membekukan tick.
Playerbots.RandomBots.MaxBots = ${PLAYERBOTS_MAX_BOTS}

# Akun RNDBOT1..RNDBOTn, masing-masing 4 karakter, jadi kandidat pool = 4 x n.
# Idempoten: boot berikutnya hanya membuat yang belum ada.
Playerbots.AutoCreate.AccountCount         = ${PLAYERBOTS_ACCOUNTS}
Playerbots.AutoCreate.CharactersPerAccount = 4

# Default dist adalah "password" -- di realm publik siapa pun bisa login sebagai
# RNDBOT1 dan memainkan karakter bot. entrypoint.sh menolak start kalau env
# var ini kosong saat Playerbots.Enable = 1.
Playerbots.AutoCreate.AccountPassword = "${PLAYERBOTS_ACCOUNT_PASSWORD}"

# Level diacak merata di rentang ini supaya tiap zona kelihatan berpenghuni,
# bukan hanya starting zone. Gear/spec/glyph diisi saat login pertama ke dunia
# (InitOnCreate dist 0), bukan saat create, supaya boot pertama tidak lama.
Playerbots.AutoCreate.MinLevel = 1
Playerbots.AutoCreate.MaxLevel = 90

# --- LFG ---------------------------------------------------------------------
# Bot acak ikut mengisi antrean dungeon finder pemain asli. Hook core-nya sudah
# ada; biarkan 0 sampai perilaku bot di dunia terbukti stabil -- ini jalur
# dengan variabel paling banyak (teleport tanpa client, proposal, role check).
Playerbots.RandomBotJoinLfg = ${PLAYERBOTS_JOIN_LFG}

# --- JANGAN dinyalakan di produksi -------------------------------------------
# Menghapus SEMUA akun ber-prefix RNDBOT beserta karakternya saat startup. Ini
# tombol reset, bukan setelan, dan sengaja tidak diekspos ke .env; pakai
# `.playerbots wipe confirm` dari console kalau memang perlu.
Playerbots.DeleteRandomBotAccounts = 0
