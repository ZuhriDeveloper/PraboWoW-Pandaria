# =============================================================================
# Override worldserver.conf. Di-BAKE ke dalam image; render-config.sh
# menggabungkannya di atas worldserver.conf.dist (~3300 baris) saat container
# start, dan mengisi ${VAR} dari environment.
# =============================================================================

# --- Database ---------------------------------------------------------------
LoginDatabaseInfo     = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};${DB_AUTH}"
WorldDatabaseInfo     = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};${DB_WORLD}"
CharacterDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};${DB_CHARACTERS}"

# Setup + upgrade database sepenuhnya ditangani core (DatabaseSetup.cpp).
# Boot pertama pada DB kosong:
#   world      -> import BaseSqlFile (dump rilis) + base/stored_procs.sql,
#                 lalu terapkan seluruh sql/updates/world/*
#   characters -> import base/characters_database.sql + sql/updates/characters/*
# Boot berikutnya: base dilewati, hanya update baru yang diterapkan.
#
# JANGAN mengimpor dump world lewat `mysql <` manual. Schema terisi tanpa tabel
# skyfire_db_updates membuat core berhenti dengan "update tracking table is
# missing on a non-empty schema" (DatabaseSetup.cpp:593-599).
WorldDatabase.AutoSetup     = 1
CharacterDatabase.AutoSetup = 1
WorldDatabase.AutoCreate     = 0
CharacterDatabase.AutoCreate = 0
WorldDatabase.AutoBaseline     = 0
CharacterDatabase.AutoBaseline = 0

WorldDatabase.SqlPath     = "${SQL_DIR_CONTAINER}"
CharacterDatabase.SqlPath = "${SQL_DIR_CONTAINER}"

# Diunduh ke volume oleh bootstrap-world-db.sh saat world DB masih kosong.
WorldDatabase.BaseSqlFile = "${WORLD_DUMP_CONTAINER}"

WorldDatabase.AllowUpdateHashMismatch     = 0
CharacterDatabase.AllowUpdateHashMismatch = 0
WorldDatabase.ImportPendingUpdates     = 0
CharacterDatabase.ImportPendingUpdates = 0

LoginDatabase.WorkerThreads     = 1
WorldDatabase.WorkerThreads     = 2
CharacterDatabase.WorkerThreads = 2
CharacterDatabase.SynchThreads  = 4

# --- Path -------------------------------------------------------------------
DataDir = "${DATA_DIR_CONTAINER}"
LogsDir = "${LOGS_DIR_CONTAINER}"

# --- Realm ------------------------------------------------------------------
# WAJIB sama dengan realmlist.id di DB auth. Dist core ship RealmID=0 sementara
# auth_database.sql:362 men-seed id=1; configure-realm.sh menulis baris dengan
# id ${REALM_ID} yang sama dengan nilai di sini.
RealmID = ${REALM_ID}
WorldServerPort = ${REALM_PORT}
BindIP = "0.0.0.0"

# --- Perilaku di container --------------------------------------------------
BeepAtStart = 0

# Console aktif; diakses lewat `docker attach`. Compose WAJIB menyetel
# tty + stdin_open, kalau tidak thread CLI membaca EOF dan mematikan proses
# beberapa detik setelah start -- terlihat persis seperti crash.
Console.Enable = 1

# Tidak diekspos ke internet.
Ra.Enable = 0
SOAP.Enabled = 0

# --- Modul ------------------------------------------------------------------
# Core punya sistem modul (top-level modules/, CMake option MODULES default ON)
# dan ship satu modul referensi: mod-example mencatat satu baris log SETIAP
# kali pemain login (modules/mod-example/src/mod_example.cpp), default menyala.
# Sistem modulnya sengaja dibiarkan ikut di-build -- supaya modul asli nanti
# tidak butuh perubahan Dockerfile -- tapi contoh bawaannya dimatikan.
Example.Enable = 0

# --- mod-prabowow (fitur pemain) -------------------------------------------
# Modul di repo core: modules/mod-prabowow. Core TIDAK membaca prabowow.conf.dist
# sendiri, jadi semua key-nya ditulis di sini. Dokumentasi tiap key ada di
# modules/mod-prabowow/conf/prabowow.conf.dist.

# .xp rate <1-N>: pengali XP per karakter, di atas Rate.XP.* di bawah.
PraboWoW.XpRate.Max = 5

# .chat <pesan>: chat satu realm, lintas faksi.
PraboWoW.WorldChat.Enable   = 1
PraboWoW.WorldChat.MinLevel = 1
PraboWoW.WorldChat.Cooldown = 3

# Item abu-abu langsung terjual saat di-loot; semua flight path faksi dikenal saat login.
PraboWoW.AutoSellGrey.Enable   = 1
PraboWoW.AllFlightPaths.Enable = 1

# NPC 900001 di tiap titik spawn karakter baru (sql/updates/world). Daftar
# barangnya diisi saat start dari EQUIPMENT kualitas heirloom saja -- senjata
# dan armor yang punya slot pakai; token honor, barang profesi dan placeholder
# dilewati. HEIRLOOM_PRICE_GOLD memaksa harga: 0 = gratis, negatif = biarkan
# harga bawaan DB2. Nilai >= 0 sekaligus menolkan SellPrice, kalau tidak
# heirloom gratis bisa dijual balik jadi gold tanpa batas.
PraboWoW.HeirloomVendor.Enable    = 1
PraboWoW.HeirloomVendor.Entry     = 900001
PraboWoW.HeirloomVendor.PriceGold = ${HEIRLOOM_PRICE_GOLD}

# Surat untuk tiap karakter baru: item 23162 (tas 36 slot) x1, pengirim NPC 900001.
PraboWoW.StarterMail.Enable      = 1
PraboWoW.StarterMail.ItemId      = 23162
PraboWoW.StarterMail.ItemCount   = 1
PraboWoW.StarterMail.SenderEntry = 900001

# --- Rate -------------------------------------------------------------------
Rate.XP.Kill    = ${RATE_XP}
Rate.XP.Quest   = ${RATE_XP}
Rate.XP.Explore = ${RATE_XP}

# Poor/Normal tetap blizzlike: melipatgandakan sampah vendor cuma memenuhi tas
# tanpa menggerakkan progresi.
Rate.Drop.Item.Poor   = ${RATE_DROP_ITEM_COMMON}
Rate.Drop.Item.Normal = ${RATE_DROP_ITEM_COMMON}

# Uncommon ke atas. Ini mengatur loot TIDAK BERKELOMPOK saja -- tabel loot boss
# dan dungeon bersifat grouped dan tidak melihat pengali kualitas, jadi
# menaikkan ini TIDAK membuat boss drop lebih banyak.
Rate.Drop.Item.Uncommon  = ${RATE_DROP_ITEM_QUALITY}
Rate.Drop.Item.Rare      = ${RATE_DROP_ITEM_QUALITY}
Rate.Drop.Item.Epic      = ${RATE_DROP_ITEM_QUALITY}
Rate.Drop.Item.Legendary = ${RATE_DROP_ITEM_QUALITY}
Rate.Drop.Item.Artifact  = ${RATE_DROP_ITEM_QUALITY}

# Biarkan 1. Flag rate diteruskan ke template yang direferensikan, jadi item di
# dalamnya sudah dapat pengali kualitasnya sendiri; menaikkan ini melipatkannya dua kali.
Rate.Drop.Item.Referenced = ${RATE_DROP_ITEM_REFERENCED}

Rate.Drop.Money      = ${RATE_DROP_MONEY}
Rate.Honor           = ${RATE_HONOR}
Rate.Reputation.Gain = ${RATE_REPUTATION}

# --- Gameplay ---------------------------------------------------------------
MaxPlayerLevel = 90
StartPlayerLevel = 1
