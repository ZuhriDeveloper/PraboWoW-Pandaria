# ── Ekstraksi data client, dalam container ──────────────────────────────────────
#
# Dijalankan di PC yang punya client WoW 5.4.8, BUKAN di VPS.
#
#   cp deploy/.env.tools.example deploy/.env.tools   # lalu isi
#   docker compose -f deploy/docker-compose.tools.yml --env-file deploy/.env.tools run --rm extract
#   docker compose -f deploy/docker-compose.tools.yml --env-file deploy/.env.tools run --rm upload
#
# Client di-mount READ-ONLY. Output ke named volume, bukan bind mount: menulis
# ~20 GB mmaps lewat bind mount Docker Desktop di Windows lambat sekali. Volume
# hidup di dalam VM WSL2, dan `upload` mengirim isinya langsung ke VPS dengan
# rsync — data tidak pernah melewati filesystem Windows.

services:
  extract:
    image: ${GHCR_PREFIX:-ghcr.io/zuhrideveloper}/prabowow-pandaria-tools:${TOOLS_IMAGE_TAG:-latest}
    volumes:
      - ${CLIENT_PATH:?CLIENT_PATH wajib diisi (folder root client, yang berisi Wow.exe)}:/client:ro
      - prabowow_extract:/out
    environment:
      # 0 = pakai semua core. Turunkan kalau PC ini masih dipakai kerja saat
      # mmaps berjalan berjam-jam.
      MMAP_THREADS: ${MMAP_THREADS:-0}
    # Tanpa TTY tidak apa-apa; ini bukan server, prosesnya selesai sendiri.
    stdin_open: true
    tty: true

  upload:
    image: ${GHCR_PREFIX:-ghcr.io/zuhrideveloper}/prabowow-pandaria-tools:${TOOLS_IMAGE_TAG:-latest}
    volumes:
      - prabowow_extract:/out:ro
      # Kunci SSH milik host, read-only. Di Windows biasanya
      # C:/Users/<nama>/.ssh
      - ${SSH_DIR:?SSH_DIR wajib diisi (folder .ssh milikmu di host)}:/root/.ssh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        # Urutan disengaja: yang WAJIB ada supaya worldserver mau boot lebih
        # dulu (dbc, db2, cameras -- totalnya ~154 MB), baru geometri yang berat.
        # db2 mudah terlewat: MoP memerlukannya di samping dbc, dan tanpa folder
        # itu worldserver berhenti dengan "Incorrect DataDir value" yang
        # menyesatkan ke arah konfigurasi, padahal datanya yang kurang.
        FOLDERS="dbc db2 cameras maps vmaps mmaps"
        for d in $$FOLDERS; do
          [ -d "/out/$$d" ] || { echo "FATAL: /out/$$d belum ada -- jalankan 'extract' dulu." >&2; exit 1; }
        done

        # Bind mount dari Windows SELALU tampil 0777, dan OpenSSH menolak private
        # key seluas itu ("bad permissions") lalu diam-diam jatuh ke prompt
        # password. Salin ke dalam container lalu set 600.
        KEY_SRC="/root/.ssh/$${SSH_KEY_NAME}"
        [ -f "$$KEY_SRC" ] || { echo "FATAL: private key tidak ada di $$KEY_SRC." >&2; exit 1; }
        install -d -m 700 /tmp/ssh
        install -m 600 "$$KEY_SRC" /tmp/ssh/key

        # ControlMaster: SELURUH upload memakai SATU koneksi TCP. Tanpa ini
        # service membuka koneksi terpisah untuk test/mkdir/rsync/chown, dan
        # VPS ini me-rate-limit port 22 -- koneksi ke-3 dan seterusnya ditolak
        # atau di-reset di tengah transfer. Gejalanya menyamar jadi "Broken
        # pipe" / "Connection timed out", seolah-olah jaringan yang buruk.
        SSHOPT="-i /tmp/ssh/key -o IdentitiesOnly=yes -o BatchMode=yes
                -o StrictHostKeyChecking=accept-new
                -o ServerAliveInterval=30 -o ServerAliveCountMax=10
                -o IPQoS=throughput
                -o ControlMaster=auto -o ControlPath=/tmp/ssh/cm
                -o ControlPersist=30m"
        SSH="ssh $$SSHOPT"

        echo "--> membuka satu koneksi SSH untuk seluruh sesi"
        if ! $$SSH -N -f "$$VPS_SSH" 2>/tmp/ssh/err; then
          echo "FATAL: tidak bisa membuka koneksi SSH ke $$VPS_SSH" >&2
          cat /tmp/ssh/err >&2
          echo "Kalau ini 'Connection refused/reset', port 22 sedang kena rate" >&2
          echo "limit. Tunggu ~10 menit lalu ulangi -- jangan mencoba berulang," >&2
          echo "tiap percobaan memperpanjang blokirnya." >&2
          exit 1
        fi
        trap '$$SSH -O exit "$$VPS_SSH" 2>/dev/null || true' EXIT

        echo "Mengirim ke $$VPS_SSH:$$VPS_DATA_PATH"
        for d in $$FOLDERS; do du -sh "/out/$$d"; done
        $$SSH "$$VPS_SSH" "mkdir -p '$$VPS_DATA_PATH'"

        # Loop-nya SADAR-KEMAJUAN, bukan sekadar menghitung percobaan: link ini
        # memutus transfer setiap beberapa MB, jadi batas "20 percobaan" akan
        # menyerah jauh sebelum 5,2 GB selesai. Yang membatalkan hanya kegagalan
        # yang BERTURUT-TURUT tanpa satu byte pun bertambah di sisi VPS --
        # selama masih ada kemajuan, ia menyambung terus dari titik terakhir.
        for folder in $$FOLDERS; do
          echo ""
          echo "=== $$folder ==="
          stall=0
          prev=0
          until rsync -ah --info=progress2 --partial --append-verify \
                  $${BW_LIMIT:+--bwlimit=$$BW_LIMIT} \
                  -e "$$SSH" "/out/$$folder" "$$VPS_SSH:$$VPS_DATA_PATH/"; do
            # Lewat koneksi yang sama -- tidak membuka TCP baru.
            now=$$($$SSH "$$VPS_SSH" "du -sb '$$VPS_DATA_PATH/$$folder' 2>/dev/null | cut -f1" || echo 0)
            now=$${now:-0}
            if [ "$$now" -gt "$$prev" ]; then stall=0; else stall=$$((stall+1)); fi
            prev=$$now
            if [ "$$stall" -ge 6 ]; then
              echo "FATAL: $$folder berhenti maju setelah 6 percobaan beruntun." >&2
              echo "Coba turunkan laju: BW_LIMIT=400 di deploy/.env.tools" >&2
              exit 1
            fi
            echo "--> putus di $$(numfmt --to=iec $$now 2>/dev/null || echo $$now)B; menyambung lagi"
            sleep 10
          done
        done

        # uid/gid 1000 harus cocok dengan user `skyfire` di image server; tanpa
        # ini mount jadi milik root dan server tidak bisa membaca satu map pun.
        $$SSH "$$VPS_SSH" "chown -R 1000:1000 '$$VPS_DATA_PATH'"
        echo ""
        $$SSH "$$VPS_SSH" "du -sh '$$VPS_DATA_PATH'/*"
        echo "Selesai."
    environment:
      VPS_SSH: ${VPS_SSH:?VPS_SSH wajib diisi (mis. root@145.79.10.227)}
      VPS_DATA_PATH: ${VPS_DATA_PATH:-/srv/prabowow/data}
      SSH_KEY_NAME: ${SSH_KEY_NAME:-id_ed25519}
      BW_LIMIT: ${BW_LIMIT:-}

networks:
  # Docker Desktop memakai MTU 1500. Kalau jalur ke VPS punya MTU efektif lebih
  # kecil (PPPoE, tunnel) DAN ICMP diblokir -- yang memang terjadi di jalur ini
  # -- Path MTU Discovery tidak bisa memberi tahu pengirim, jadi paket besar
  # hilang diam-diam. Sesi kecil tetap lolos, transfer besar mati. 1400 aman
  # untuk hampir semua jalur.
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  # ~20-25 GB. Hapus dengan `docker volume rm prabowow_extract` setelah data
  # aman di VPS dan sudah diverifikasi.
  prabowow_extract:
